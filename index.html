<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petite Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7c3aed">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#ece6ff;--ink:#241a4a;--card:#ffffff;--ac:#7c3aed;--ac2:#ec4899;--sun:#06b6d4;--lt:#e9e3ff;--dk:#8b7bd8;--glow:0 0 0 transparent;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0820;--ink:#f1ecff;--card:#171238;--ac:#a855f7;--ac2:#ff3d9a;--sun:#22d3ee;--lt:#241c55;--dk:#120c33;--glow:0 0 16px #a855f7aa}}
:root[data-theme="dark"]{--bg:#0b0820;--ink:#f1ecff;--card:#171238;--ac:#a855f7;--ac2:#ff3d9a;--sun:#22d3ee;--lt:#241c55;--dk:#120c33;--glow:0 0 16px #a855f7aa}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 20% 0,var(--lt),var(--bg) 65%) fixed;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
#app{max-width:460px;margin:0 auto;padding:12px;text-align:center}
.card{background:var(--card);border:2px solid var(--ac);border-radius:24px;padding:20px;box-shadow:var(--glow),0 10px 30px #0003;margin:12px 0;display:flex;flex-direction:column;gap:10px}
h1,h2,header b{margin:0;font-family:Orbitron,system-ui,sans-serif;letter-spacing:.04em}h1{font-size:28px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}p{margin:4px 0}
button{font:inherit;font-weight:800;font-size:17px;padding:11px 16px;border-radius:16px;border:2px solid transparent;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:var(--glow);cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--ac);box-shadow:none}
button:active{transform:translateY(2px)}
input{font:inherit;padding:12px;border:2px solid var(--ac);border-radius:14px;background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.row>button{flex:1}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.msg{color:var(--ac);font-weight:700;min-height:1.2em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{font-size:18px;padding:18px 8px}
#set,#ck{position:fixed;z-index:9}
#set{inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:20px}#set .card{width:100%;max-width:340px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}#set .bk{position:sticky;top:0;z-index:2;display:block;width:auto;margin:0 0 8px;font-size:22px;padding:6px 16px}
#ck{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:14px;box-shadow:4px 4px 0 var(--ink);max-width:440px;margin:auto}
#ck .row{margin-top:10px}
#tp{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;margin:auto;max-width:440px;background:var(--ink);color:var(--bg);padding:12px;border-radius:12px;font-weight:700;z-index:10}
.tt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,330px);margin:auto}
.tt button{aspect-ratio:1;font-size:44px;background:var(--card);color:var(--ink);padding:0}
.bd{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,420px);aspect-ratio:1;margin:auto;border:3px solid var(--ink)}
.sq{display:flex;align-items:center;justify-content:center;background:var(--lt)}.sq.d{background:var(--dk)}
.h{outline:4px solid var(--sun);outline-offset:-4px}.s{box-shadow:inset 0 0 0 4px var(--ac)}
.pc{width:78%;height:78%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;border:2px solid #0006}
.pc.w{background:radial-gradient(circle at 35% 30%,#fff,#67e8f9);color:#0e7490}.pc.b{background:radial-gradient(circle at 35% 30%,#fbcfe8,#db2777);color:#fff}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd{aspect-ratio:1;font-size:34px;padding:0;background:var(--card);color:var(--ink)}.cd.ok{opacity:.45}
canvas{width:min(100%,320px);touch-action:none;border:3px solid var(--ink);border-radius:12px;background:#1d1420}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--ac);z-index:5}nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:20px;padding:6px 2px;border-radius:12px}nav small{font-size:11px}
.sr{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;text-align:left;padding:8px 0;border-bottom:1px solid #8884}.gm{display:flex;align-items:center;gap:14px;text-align:left}.gm span:first-child{font-size:32px}.gm small{display:block;font-weight:500;opacity:.85}
iframe{width:100%;height:calc(100vh - 90px);border:3px solid var(--ink);border-radius:14px;margin-top:10px;background:var(--card)}
</style></head><body><div id="app"></div>

/* ===== IA Modération : numéro de téléphone obligatoire ===== */
function phoneCheck(p){const v=cid(p);
if(!/^\+\d{9,15}$/.test(v))return 'Entre un vrai numéro de téléphone (ex : 06 12 34 56 78 ou +33 6 12 34 56 78).';
if(v.startsWith('+33')&&!/^\+33[1-9]\d{8}$/.test(v))return 'Numéro français invalide (ex : 06 12 34 56 78).';
const n=v.slice(1);
if(/(\d)\1{5,}/.test(n)||/0123456789|1234567890|123456789|987654321/.test(n)||new Set(n.slice(-8)).size<3)return 'Ce numéro a l’air faux. Utilise ton vrai numéro.';
return ''}
function hasPh(k){return isPh(String(k).replace(/[\s.\-()]/g,''))}
function nopList(){const us=store.g('pa-u',{});return Object.keys(us).map((k,i)=>({k,i,r:!hasPh(k)?'Pas de numéro de téléphone':(phoneCheck(k)?'Numéro suspect':'')})).filter(x=>x.r)}
function aiScan(){const l=nopList(),q=store.g('pa-in',[]),rp=store.g('pa-nop',[]);let ch=0;
l.forEach((x,j)=>{if(rp.includes(x.k))return;rp.push(x.k);q.push({id:Date.now()+j,f:'🤖 IA Modération',t:'📵 '+x.r+' : '+x.k+'. À supprimer ?',nop:x.k,d:new Date().toLocaleString('fr-FR')});ch=1});
if(ch){store.s('pa-in',q);store.s('pa-nop',rp)}return l.length}
function aiRun(){const n=aiScan();toast(n?'🤖 '+n+' compte(s) à vérifier.':'🤖 Aucun compte suspect.');sets()}
var DN=0;
function delNop(){if(!DN){DN=1;return sets()}DN=0;const l=nopList().map(x=>x.k),us=store.g('pa-u',{}),pl=store.g('pa-pl',{}),sc=store.g('pa-sc',{}),dl=store.g('pa-del',[]);
l.forEach(k=>{delete us[k];delete pl[k];delete sc[k];if(!dl.includes(k))dl.push(k)});
store.s('pa-u',us);store.s('pa-pl',pl);store.s('pa-sc',sc);store.s('pa-del',dl);store.s('pa-in',store.g('pa-in',[]).filter(m=>!l.includes(m.nop)));toast('🗑 '+l.length+' compte(s) supprimé(s).');sets()}
